services:
  # ---------------------------
  # Postgres (stores KPI snapshots)
  # ---------------------------
  db:
    image: postgres:16-alpine
    container_name: streamsense-db
    environment:
      POSTGRES_DB: streamsense
      POSTGRES_USER: streamsense
      POSTGRES_PASSWORD: streamsense
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Runs only on FIRST startup of the volume
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamsense -d streamsense"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------
  # Redpanda (Kafka-compatible broker)
  # Keeps setup simple vs Kafka+Zookeeper.
  # ---------------------------
  kafka:
    image: redpandadata/redpanda:latest
    container_name: streamsense-kafka
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:9092
    ports:
      - "9092:9092"
      # Optional: Redpanda console/admin endpoints (handy during debugging)
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -qi healthy"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------------------
  # Backend API (serves KPI data to the frontend)
  # ---------------------------
  backend:
    build: ./backend
    container_name: streamsense-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://streamsense:streamsense@db:5432/streamsense
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------
  # Worker (consumes Kafka events and writes KPIs to Postgres)
  # ---------------------------
  worker:
    build: ./worker
    container_name: streamsense-worker
    environment:
      DATABASE_URL: postgresql://streamsense:streamsense@db:5432/streamsense
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: events
      KAFKA_GROUP_ID: streamsense-worker
      SERVICE_NAME: api
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ---------------------------
  # Frontend (optional: if you already created ./frontend Dockerfile)
  # If you don't have a frontend yet, you can comment this out.
  # ---------------------------
  frontend:
    build: ./frontend
    container_name: streamsense-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  db_data: